<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Match Evaluator v3</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 40px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .updated {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 14px;
      cursor: pointer;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .team-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .team-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .vs {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface-2);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .form-row {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin-top: 5px;
    }

    .f-dot {
      font-size: 0.65rem;
      font-weight: 700;
      width: 17px;
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .f-W { background: rgba(34,197,94,0.2); color: var(--green); }
    .f-D { background: rgba(245,158,11,0.2); color: var(--amber); }
    .f-L { background: rgba(239,68,68,0.2); color: var(--red); }

    .quick-probs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .qp-box {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }
    .qp-label { font-size: 0.68rem; color: var(--muted); }
    .qp-val { font-size: 0.85rem; font-weight: 700; color: var(--text); }

    .card-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 12px 14px 16px;
    }
    .card.open .card-body { display: block; }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--surface-2);
      color: var(--muted);
      border: none;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0b1120;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin: 10px 0 6px;
    }
    .section-title:first-child { margin-top: 0; }

    .prob-bar-wrap { margin-bottom: 8px; }
    .prob-bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 3px;
    }
    .bar-track {
      height: 7px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    ul.drivers {
      padding-left: 16px;
      font-size: 0.82rem;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    table.stats-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-bottom: 10px;
    }
    table.stats-tbl td, table.stats-tbl th {
      padding: 6px 4px;
      border-bottom: 1px solid var(--surface-2);
      text-align: center;
    }
    table.stats-tbl th { color: var(--muted); font-weight: 600; }
    table.stats-tbl td:nth-child(2) { color: var(--muted); font-size: 0.72rem; }

    .player-item {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .player-name { font-size: 0.85rem; font-weight: 700; }
    .player-meta { font-size: 0.73rem; color: var(--muted); }
    .player-prob {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    /* Value Calculator */
    .calc-box {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .calc-box label {
      font-size: 0.75rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    .calc-box select, .calc-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }
    .calc-result {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-strong { background: rgba(34,197,94,0.2); color: var(--green); }
    .badge-mod { background: rgba(245,158,11,0.2); color: var(--amber); }
    .badge-no { background: rgba(239,68,68,0.2); color: var(--red); }

    .quality-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.74rem;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Match Evaluator v3</h1>
      <span id="updatedAt" class="updated">Caricamento...</span>
    </div>
    <div id="filters" class="filters"></div>
  </header>

  <main id="app">
    <div class="empty-state">Caricamento dati da <code>matches.json</code>...</div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    let allMatches = [];
    let selectedComp = "Tutte";

    const fmtDate = (iso) => {
      if (!iso) return "N/D";
      const d = new Date(iso);
      return d.toLocaleString("it-IT", {
        weekday: "short", day: "2-digit", month: "short",
        hour: "2-digit", minute: "2-digit"
      });
    };

    const fmtVal = (v) => (v === null || v === undefined ? "N/D" : v);

    const probBar = (label, p) => {
      if (!p) return "";
      const fair = p.mid > 0 ? (100 / p.mid).toFixed(2) : "-";
      return `
        <div class="prob-bar-wrap">
          <div class="prob-bar-head">
            <span>${label}</span>
            <strong>${p.min}% - ${p.max}% <span style="color:var(--muted);font-weight:400">(equa @${fair})</span></strong>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.min(100, p.mid)}%"></div>
          </div>
        </div>
      `;
    };

    const formBadges = (arr = []) =>
      arr.map(r => `<span class="f-dot f-${r}">${r}</span>`).join("");

    function buildMarketOptions(m) {
      const a = m.analysis;
      const opts = [
        { label: `1 - ${m.teams.home.name}`, p: a["1_outcome_1x2"].home_win },
        { label: `X - Pareggio`, p: a["1_outcome_1x2"].draw },
        { label: `2 - ${m.teams.away.name}`, p: a["1_outcome_1x2"].away_win },
        { label: `Over 2.5 Gol`, p: a["2_goals"].over_2_5 },
        { label: `Under 2.5 Gol`, p: a["2_goals"].under_2_5 },
        { label: `Gol (BTTS Sì)`, p: a["2_goals"].btts_yes },
        { label: `NoGol (BTTS No)`, p: a["2_goals"].btts_no },
        { label: `Over ${a["3_corners"].line} Corner`, p: a["3_corners"].over_line },
        { label: `Under ${a["3_corners"].line} Corner`, p: a["3_corners"].under_line },
        { label: `Over ${a["4_team_cards"].line} Cartellini`, p: a["4_team_cards"].over_line },
        { label: `Rigore Sì`, p: a["5_penalties"].penalty_yes }
      ];
      (a["6_player_goals"] || []).forEach(pg => {
        opts.push({ label: `Gol: ${pg.player}`, p: pg.prob });
      });
      (a["7_player_cards"] || []).forEach(pc => {
        opts.push({ label: `Cartellino: ${pc.player}`, p: pc.prob });
      });
      return opts;
    }

    function updateCalc(matchId) {
      const m = allMatches.find(x => x.id === matchId);
      if (!m) return;
      const sel = document.getElementById(`sel-${matchId}`);
      const inp = document.getElementById(`odd-${matchId}`);
      const out = document.getElementById(`res-${matchId}`);
      const opts = buildMarketOptions(m);
      const chosen = opts[Number(sel.value)];
      const odd = parseFloat(inp.value);

      if (!odd || odd <= 1.01) {
        out.innerHTML = `<div style="grid-column:1/-1;color:var(--muted)">Inserisci una quota decimale valida (es. 1.85)</div>`;
        return;
      }

      const implied = (100 / odd);
      const fairMid = 100 / chosen.p.mid;
      const edgeMid = chosen.p.mid - implied;
      const edgeMin = chosen.p.min - implied;

      let badge = `<span class="badge badge-no">NO VALUE</span>`;
      if (edgeMin > 0) badge = `<span class="badge badge-strong">VALUE FORTE</span>`;
      else if (edgeMid > 0) badge = `<span class="badge badge-mod">VALUE MODERATO</span>`;

      out.innerHTML = `
        <div><span style="color:var(--muted)">Prob. Implicita:</span><br><strong>${implied.toFixed(1)}%</strong></div>
        <div><span style="color:var(--muted)">Quota Equa (mid):</span><br><strong>@${fairMid.toFixed(2)}</strong></div>
        <div><span style="color:var(--muted)">Edge su Media:</span><br><strong>${edgeMid >= 0 ? "+" : ""}${edgeMid.toFixed(1)}%</strong></div>
        <div><span style="color:var(--muted)">Edge Prudenziale:</span><br><strong>${edgeMin >= 0 ? "+" : ""}${edgeMin.toFixed(1)}%</strong></div>
        <div style="grid-column:1/-1;margin-top:4px">${badge} <span style="color:var(--muted);font-size:0.74rem">(Stima: ${chosen.p.min}% - ${chosen.p.max}%)</span></div>
      `;
    }

    function renderFilters() {
      const comps = ["Tutte", ...new Set(allMatches.map(m => m.competition))];
      document.getElementById("filters").innerHTML = comps.map(c => `
        <button class="pill ${c === selectedComp ? "active" : ""}" onclick="setComp('${c}')">${c}</button>
      `).join("");
    }

    function setComp(c) {
      selectedComp = c;
      renderFilters();
      renderMatches();
    }

    function toggleCard(id) {
      document.getElementById(`card-${id}`).classList.toggle("open");
    }

    function switchTab(id, tabName, btn) {
      const body = document.querySelector(`#card-${id} .card-body`);
      body.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      body.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      body.querySelector(`.tab-panel[data-tab="${tabName}"]`).classList.add("active");
    }

    function renderMatches() {
      const list = selectedComp === "Tutte"
        ? allMatches
        : allMatches.filter(m => m.competition === selectedComp);

      const app = document.getElementById("app");
      if (!list.length) {
        app.innerHTML = `<div class="empty-state">Nessuna partita trovata per questo filtro.</div>`;
        return;
      }

      app.innerHTML = list.map(m => {
        const h = m.teams.home;
        const aw = m.teams.away;
        const a = m.analysis;
        const opts = buildMarketOptions(m);

        return `
          <article class="card" id="card-${m.id}">
            <div class="card-header" onclick="toggleCard('${m.id}')">
              <div class="meta-row">
                <span>${m.competition} · ${m.matchday || ""}</span>
                <span>${fmtDate(m.kickoff_iso)}</span>
              </div>
              <div class="teams-row">
                <div>
                  <div class="team-name">${h.name}</div>
                  <div class="team-sub">${h.position}° · ${h.points} pt</div>
                  <div class="form-row">${formBadges(h.recent_form)}</div>
                </div>
                <div class="vs">VS</div>
                <div>
                  <div class="team-name">${aw.name}</div>
                  <div class="team-sub">${aw.position}° · ${aw.points} pt</div>
                  <div class="form-row">${formBadges(aw.recent_form)}</div>
                </div>
              </div>
              <div class="quick-probs">
                <div class="qp-box"><div class="qp-label">1</div><div class="qp-val">${a["1_outcome_1x2"].home_win.mid}%</div></div>
                <div class="qp-box"><div class="qp-label">X</div><div class="qp-val">${a["1_outcome_1x2"].draw.mid}%</div></div>
                <div class="qp-box"><div class="qp-label">2</div><div class="qp-val">${a["1_outcome_1x2"].away_win.mid}%</div></div>
              </div>
            </div>

            <div class="card-body">
              <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('${m.id}','1x2',this)">1X2 & Dati</button>
                <button class="tab-btn" onclick="switchTab('${m.id}','gol',this)">Gol</button>
                <button class="tab-btn" onclick="switchTab('${m.id}','cc',this)">Corner/Cart.</button>
                <button class="tab-btn" onclick="switchTab('${m.id}','rig',this)">Rigori</button>
                <button class="tab-btn" onclick="switchTab('${m.id}','ply',this)">Giocatori</button>
                <button class="tab-btn" onclick="switchTab('${m.id}','val',this)">Calcolatore</button>
              </div>

              <div class="tab-panel active" data-tab="1x2">
                <table class="stats-tbl">
                  <tr><th>${h.name}</th><th>Metrica</th><th>${aw.name}</th></tr>
                  <tr><td>${fmtVal(h.xg_per_game)}</td><td>xG / gara</td><td>${fmtVal(aw.xg_per_game)}</td></tr>
                  <tr><td>${fmtVal(h.xga_per_game)}</td><td>xGA / gara</td><td>${fmtVal(aw.xga_per_game)}</td></tr>
                  <tr><td>${h.goals_for} / ${h.goals_against}</td><td>GF / GS</td><td>${aw.goals_for} / ${aw.goals_against}</td></tr>
                  <tr><td>${fmtVal(h.split_stats?.gf_per_game)}</td><td>GF Split</td><td>${fmtVal(aw.split_stats?.gf_per_game)}</td></tr>
                  <tr><td>${fmtVal(h.rest_days)}g</td><td>Riposo</td><td>${fmtVal(aw.rest_days)}g</td></tr>
                </table>
                <div class="section-title">Probabilità 1X2</div>
                ${probBar("1 - " + h.name, a["1_outcome_1x2"].home_win)}
                ${probBar("X - Pareggio", a["1_outcome_1x2"].draw)}
                ${probBar("2 - " + aw.name, a["1_outcome_1x2"].away_win)}
                <div class="section-title">Driver & Anomalie</div>
                <ul class="drivers">
                  ${(a["1_outcome_1x2"].drivers || []).map(d => `<li>${d}</li>`).join("")}
                  ${(a["1_outcome_1x2"].anomalies || []).map(d => `<li><strong>Anomalia:</strong> ${d}</li>`).join("")}
                </ul>
              </div>

              <div class="tab-panel" data-tab="gol">
                <div class="section-title">Over / Under & BTTS</div>
                ${probBar("Over 2.5 Gol", a["2_goals"].over_2_5)}
                ${probBar("Under 2.5 Gol", a["2_goals"].under_2_5)}
                ${probBar("Gol (BTTS Sì)", a["2_goals"].btts_yes)}
                ${probBar("NoGol (BTTS No)", a["2_goals"].btts_no)}
                <div class="section-title">Driver Gol</div>
                <ul class="drivers">
                  ${(a["2_goals"].drivers || []).map(d => `<li>${d}</li>`).join("")}
                </ul>
              </div>

              <div class="tab-panel" data-tab="cc">
                <div class="section-title">Corner (Linea ${a["3_corners"].line})</div>
                ${probBar(`Over ${a["3_corners"].line} Corner`, a["3_corners"].over_line)}
                ${probBar(`Più Corner: ${a["3_corners"].most_corners_team === "home" ? h.name : aw.name}`, a["3_corners"].most_corners_prob)}
                <ul class="drivers" style="margin-bottom:10px">
                  ${(a["3_corners"].drivers || []).map(d => `<li>${d}</li>`).join("")}
                </ul>
                <div class="section-title">Cartellini (Linea ${a["4_team_cards"].line} · Arbitro: ${m.referee?.name || "N/D"})</div>
                ${probBar(`Over ${a["4_team_cards"].line} Cartellini`, a["4_team_cards"].over_line)}
                ${probBar(`Più Cartellini: ${a["4_team_cards"].most_cards_team === "home" ? h.name : aw.name}`, a["4_team_cards"].most_cards_prob)}
                <ul class="drivers">
                  ${(a["4_team_cards"].drivers || []).map(d => `<li>${d}</li>`).join("")}
                </ul>
              </div>

              <div class="tab-panel" data-tab="rig">
                <div class="section-title">Probabilità Rigore</div>
                ${probBar("Rigore Sì nel match", a["5_penalties"].penalty_yes)}
                <p style="font-size:0.8rem;color:var(--muted);margin-bottom:8px">
                  Squadra favorita: <strong>${a["5_penalties"].favored_team === "home" ? h.name : aw.name}</strong>
                </p>
                <ul class="drivers">
                  ${(a["5_penalties"].drivers || []).map(d => `<li>${d}</li>`).join("")}
                </ul>
              </div>

              <div class="tab-panel" data-tab="ply">
                <div class="section-title">Possibili Marcatori</div>
                ${(a["6_player_goals"] || []).map(p => `
                  <div class="player-item">
                    <div>
                      <div class="player-name">${p.player} (${p.role})</div>
                      <div class="player-meta">${p.key_metric}</div>
                    </div>
                    <div class="player-prob">${p.prob.min}-${p.prob.max}%</div>
                  </div>
                `).join("")}
                <div class="section-title">Possibili Cartellini</div>
                ${(a["7_player_cards"] || []).map(p => `
                  <div class="player-item">
                    <div>
                      <div class="player-name">${p.player} (${p.role}) ${p.cautioned_diffida ? "⚠️ Diff." : ""}</div>
                      <div class="player-meta">${p.key_metric}</div>
                    </div>
                    <div class="player-prob">${p.prob.min}-${p.prob.max}%</div>
                  </div>
                `).join("")}
              </div>

              <div class="tab-panel" data-tab="val">
                <div class="calc-box">
                  <div>
                    <label for="sel-${m.id}">Mercato stimato</label>
                    <select id="sel-${m.id}" onchange="updateCalc('${m.id}')">
                      ${opts.map((o, idx) => `<option value="${idx}">${o.label} (${o.p.mid}%)</option>`).join("")}
                    </select>
                  </div>
                  <div>
                    <label for="odd-${m.id}">Quota bookmaker (decimale)</label>
                    <input id="odd-${m.id}" type="number" step="0.01" min="1.01" placeholder="Es. 1.95" oninput="updateCalc('${m.id}')" />
                  </div>
                  <div class="calc-result" id="res-${m.id}">
                    <div style="grid-column:1/-1;color:var(--muted)">Inserisci una quota per calcolare l'edge.</div>
                  </div>
                </div>
              </div>

              <div class="quality-box">
                <strong>Affidabilità:</strong> ${m.data_quality?.confidence || "N/D"} ·
                <strong>Fonti:</strong> ${(m.data_quality?.sources_used || []).join(", ")}
                ${(m.data_quality?.coverage_gaps || []).length ? `<br><strong>Limiti:</strong> ${m.data_quality.coverage_gaps.join("; ")}` : ""}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function init() {
      try {
        const res = await fetch("./matches.json", { cache: "no-store" });
        if (!res.ok) throw new Error("File matches.json non trovato");
        const data = await res.json();
        allMatches = data.matches || [];
        document.getElementById("updatedAt").textContent = "Agg: " + fmtDate(data.generated_at);
        renderFilters();
        renderMatches();
      } catch (err) {
        document.getElementById("updatedAt").textContent = "Offline / Errore";
        document.getElementById("app").innerHTML = `
          <div class="empty-state">
            Impossibile caricare <code>matches.json</code>.<br>
            Assicurati di aver salvato il file JSON nella stessa cartella e di aprire la PWA tramite server locale o GitHub Pages.
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
